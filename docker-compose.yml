services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en tu archivo .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-datos:/var/opt/mssql

volumes:
  sqlserver-datos:
