services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver-datos:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    image: gestortareas-app
    env_file:
      - .env
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=GestorTareas;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "5065:8080"
    volumes:
      - documentos-datos:/app/datos/documentos
    depends_on:
      sqlserver:
        condition: service_healthy

  enviador:
    build: .
    image: gestortareas-app
    profiles: ["enviador"]
    entrypoint: ["dotnet", "/app/enviador/GestorTareas.Enviador.dll"]
    env_file:
      - .env
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=GestorTareas;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-datos:
  documentos-datos:
